# Panel de administración — Sol Naciente de Pastos Grandes
#
backend:
  name: github
  repo: SolNacientes/sol-naciente
  branch: main
  base_url: https://sveltia-cms-auth.collasolnacientedepastosgrande.workers.dev

media_folder: assets/uploads
public_folder: assets/uploads

site_url: /
display_url: /

collections:
  - name: noticias
    label: Noticias
    description: Las tarjetas de la sección "Voces del territorio" del home.
    files:
      - name: lista
        label: Lista de noticias
        file: content/noticias.json
        fields:
          - name: items
            label: Noticias
            label_singular: noticia
            widget: list
            summary: "{{fields.titulo}}"
            fields:
              - { name: titulo, label: Título, widget: string }
              - { name: fecha, label: Fecha, widget: string, hint: "Ej: 12 de junio, 2026" }
              - { name: imagen, label: Imagen, widget: image }
              - { name: resumen, label: Resumen, widget: text }
              - { name: enlace, label: "Enlace (opcional)", widget: string, required: false, hint: "URL de la nota completa, si existe" }
